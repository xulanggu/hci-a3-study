name: Validate study app
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python311:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: a3/requirements*.txt
      - run: python -m pip install -r a3/requirements-dev.txt
      - run: python -m pip check
      - run: python a3/scripts/verify_model.py
      - run: python -m pytest a3/tests -q
      - run: python a3/scripts/simulate.py
